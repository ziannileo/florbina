<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flor - Bina</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        html {
            scroll-snap-type: y mandatory;
            scroll-behavior: auto;
        }

        body {
            position: relative;
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            cursor: none;
        }

        .fundo {
            position: absolute; 
            width: 100%;
            height: 100%; 
            background: 
                linear-gradient(rgba(255, 240, 245, 0.92), rgba(255, 240, 245, 0.92)),
                url("img/fundo.jpeg");
            background-size: cover;
            background-position: center top;
            z-index: -2;
            transition: transform 0.2s linear;
        }

        @media (max-width: 768px) {
            .fundo {
                background-position: center center;
            }
        }

        section {
            scroll-snap-align: start;
            min-height: 100vh;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            will-change: transform, opacity;
        }

        .content {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.9s ease;
        }

        section.show .content {
            opacity: 1;
            transform: translateY(0);
        }

        h1 {
            font-size: clamp(2.4rem, 6vw, 4rem);
            color: #c2185b;
            margin-bottom: 20px;
        }

        p {
            font-size: clamp(1.1rem, 3vw, 1.35rem);
            line-height: 1.6;
        }

        .gallery {
            display: grid;
            gap: 20px;
            margin-top: 30px;
        }

        .gallery img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            position: relative;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            width: 16px;
            height: 16px;
            pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23e91e63"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
            background-size: cover;
            opacity: 0.8;
            animation: floatHeart 1.5s linear forwards;
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-80px) scale(1.5);
                opacity: 0;
            }
        }

        .heartEvent {
            display: inline-block;
            position: relative; 
            border-radius: 15px;
            overflow: hidden;
            background: linear-gradient(135deg, #fde0eb, #fff0f5, #fbcfe8);
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .heartEvent:hover {
            box-shadow: 0 8px 20px rgba(194, 24, 91, 0.25), inset 0 0 0 2px rgba(255, 255, 255, 0.6);
        }

        .heartEvent img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @media (min-width: 769px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
                max-width: 900px;
            }

            .gallery img {
                height: 380px;
            }
        }

        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: 1fr;
                max-width: 100%;
            }

            .gallery img {
                height: 420px;
            }
        }

        .message {
            margin-top: 30px;
            color: #880e4f;
        }

        .custom-cursor {
            position: fixed;
            width: 24px;
            height: 24px;
            pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23e91e63"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
            background-size: cover;
            z-index: 9999;
            transform: translate(-50%, -50%);
        }

        .trail-heart {
            position: fixed;
            width: 16px;
            height: 16px;
            pointer-events: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23e91e63"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
            background-size: cover;
            opacity: 0.8;
            animation: trailFade 1s forwards;
            z-index: 9998;
        }

        @keyframes trailFade {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        .titleWrite, .typeParagraph {
            opacity: 0;
        }

        .scroll-arrow {
            margin-top: 40px;
            font-size: 3rem;
            color: #c2185b;
            opacity: 0;
            transition: opacity 0.6s ease;
            animation: bounce 1s infinite alternate;   
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(15px); }
        }

    </style>
</head>
<body>

    <div class="fundo"></div>

    <section>
        <div class="content">
            <h1 class="titleWrite">&#x2764 Eu te amo, Bina &#x2764</h1>

            <div class="message">
                <p class="typeParagraph">Desde que tu chegou em minha vida tudo ficou mais leve e bonito.</p>
                <p class="typeParagraph">Esse cantinho é só pra mostrar o quanto você é especial!</p>
            </div>
        </div>

        <div class="scroll-arrow">&#x2193;</div>

    </section>

    <section>
        <div class="content">
            <h1 class="titleWrite">Nós dois</h1>

            <div class="gallery">
                <div class="heartEvent">
                    <img src="img/foto1.jpeg">
                </div>
                <div class="heartEvent">
                    <img src="img/foto2.jpeg">
                </div>
                <div class="heartEvent">
                    <img src="img/foto3.jpeg">
                </div>
            </div>

            <div class="message">
                <p class="typeParagraph">Cada momento contigo é uma memória que eu guardo com carinho.</p>
                <p class="typeParagraph">Que a gente continue construindo histórias juntos. 💕</p>
            </div>
        </div>
    </section>

    <script>
        function typeEffect(element, speed = 100) {
            const text = element.textContent;

            const clone = element.cloneNode(true);
            clone.style.visibility = 'hidden';
            clone.style.position = 'absolute';
            clone.textContent = text;
            document.body.appendChild(clone);
            const height = clone.offsetHeight;
            document.body.removeChild(clone);

            element.style.minHeight = height + 'px';

            element.textContent = '';
            let span = document.createElement('span');
            element.appendChild(span);
            element.style.opacity = 1;

            let i = 0;
            clearInterval(element._typingTimer);

            element._typingTimer = setInterval(() => {
                span.textContent = text.slice(0, i) + '|';
                i++;

                if (i > text.length) {
                    span.textContent = text;
                    clearInterval(element._typingTimer);
                }
            }, speed);
        }

        function showImagesSequentially(images, delay = 300) {
            images.forEach((img, index) => {
                setTimeout(() => {
                    img.style.opacity = 1;
                    img.style.transformn = "scale(1.05)";

                    setTimeout(() => {
                        img.style.transform = "scale(1)";
                    }, 400);

                }, index * delay);
            });
        }

        const cursor = document.createElement('div');
            cursor.className = 'custom-cursor';
            document.body.appendChild(cursor);

            document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';

            const trail = document.createElement('div');
            trail.className = 'trail-heart';
            trail.style.left = e.clientX + 'px';
            trail.style.top = e.clientY + 'px';
            document.body.appendChild(trail);

            setTimeout(() => trail.remove(), 1000);
        });

        const sections = document.querySelectorAll("section");

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add("show");

                    if (!entry.target.classList.contains("typed")) {
                        const titles = entry.target.querySelectorAll(".titleWrite");
                        const paragraphs = entry.target.querySelectorAll(".typeParagraph");
                        const images = entry.target.querySelectorAll(".heartEvent");
                        let arrow = entry.target.querySelector('.scroll-arrow');

                        let delay = 0;
                        titles.forEach(title => {
                            setTimeout(() => typeEffect(title, 100), delay);
                            delay += title.textContent.length * 100 + 400;
                        });

                        setTimeout(() => {
                            showImagesSequentially(images, 400);
                        }, delay)

                        let paraDelay = delay + images.length * 400;
                        paragraphs.forEach(p => {
                            setTimeout(() => typeEffect(p, 100), paraDelay);
                            paraDelay += p.textContent.length * 100 + 400;
                        });

                        entry.target.classList.add("typed");

                        if (arrow) {
                            let totalDelay = delay + images.length * 400;
                            paragraphs.forEach(p => {
                                totalDelay += p.textContent.length * 100 + 400;
                            });

                            setTimeout(() => {
                                arrow.style.opacity = 1;
                            }, totalDelay);
                        }
                    }

                } else {
                    entry.target.classList.remove("show");
                }
            });
        }, {
            threshold: 0.3,
            rootMargin: "0px 0px -80px 0px"
        });

        sections.forEach(section => observer.observe(section));

        document.querySelectorAll('.heartEvent').forEach(container => {
            container.addEventListener('click', () => {
                const count = 10;

                for (let i = 0; i < count; i++) {
                    const heart = document.createElement('div');
                    heart.className = 'heart';

                    const rect = container.getBoundingClientRect();
                    heart.style.left = Math.random() * rect.width + 'px';
                    heart.style.top = Math.random() * rect.height + 'px';

                    container.appendChild(heart);

                    setTimeout(() => heart.remove(), 1500);
                }
            });
        });

        window.addEventListener('load', () => {
            window.scrollTo(0, 0)
        })

        const firstArrow = document.querySelector('.scroll-arrow');
        const secondSection = sections[1];

        if (firstArrow && secondSection) {
            firstArrow.addEventListener('click', () => {
                secondSection.scrollIntoView({ behavior: 'smooth' });
            });
        }

    </script>

</body>
</html>
